<style>
/* Layout: one centred column on near-black; faint converging "road" lines rise to the shield, echoing the logo */
:root{
  --ink:#0d0d0f; --ink-2:#16161a; --steel:#e9e9ec; --steel-dim:#9a9aa3; --line:rgba(220,220,228,.09);
  --gold-1:#c9a95c; --gold-2:#8a6d32;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --body:"Jost","Montserrat",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--steel);font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{position:relative;min-height:100%;display:grid;grid-template-rows:1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(60% 45% at 50% 30%,#232329 0%,var(--ink-2) 40%,var(--ink) 100%)}
.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.road line{stroke:var(--line);stroke-width:1}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:clamp(20px,3.5vw,32px);padding-block:clamp(48px,10vh,110px) 40px}
.shield{width:clamp(130px,22vw,190px);height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.mark{display:flex;flex-direction:column;align-items:center;gap:.35em}
.mark h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(2.1rem,7vw,3.8rem);
  letter-spacing:.14em;padding-left:.14em;line-height:1}
.mark .sub{font-family:var(--display);font-weight:500;font-size:clamp(1.05rem,3.2vw,1.7rem);
  letter-spacing:.42em;padding-left:.42em;line-height:1;
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1) 45%,var(--gold-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-1),transparent)}
.soon{margin:0;font-family:var(--display);font-size:.78rem;font-weight:500;letter-spacing:.5em;
  padding-left:.5em;text-transform:uppercase;color:var(--gold-1)}
.lede{margin:0;max-width:34ch;font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.6;color:var(--steel-dim);text-wrap:balance}
.areas{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;
  gap:10px 22px;max-width:640px;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.areas li{display:inline-flex;align-items:center}
.areas li:not(:last-child)::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--gold-1);margin-left:22px;flex:none}
footer{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;
  padding-block:22px max(22px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  font-size:.75rem;letter-spacing:.08em;color:#6e6e76;text-align:center}
.fade{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.road line{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 2.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fade,.road line{animation:none}}
</style>
